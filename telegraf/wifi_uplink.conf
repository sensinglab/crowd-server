# wifi_v2_uplink.conf
# Novos sensores Wi-Fi — bucket resolvido via pg_router_execd (lookup por UUID)

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = true

#####################################
## Input: Detections v2
#####################################
[[inputs.mqtt_consumer]]
  servers = ["${MQTT_URL}"]
  topics = ["${WIFI_COUNT_TOPIC}"]
  topic_tag = ""
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  data_format      = "json"
  json_time_key    = "timestamp"
  json_time_format = "unix"
  name_override    = "numdetections"

  [inputs.mqtt_consumer.tags]
    technology = "wifi_v2"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic       = "+/+/+/+/+/+"
    measurement = "_/_/_/_/measurement/_"
    tags        = "_/_/_/_/_/sensor_uuid"

#####################################
## Input: Sensor Location v2
#####################################
[[inputs.mqtt_consumer]]
  servers = ["${MQTT_URL}"]
  topics = ["${WIFI_LOCATION_TOPIC}"]
  topic_tag = ""
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  data_format   = "json"
  name_override = "sensorLocation"

  [inputs.mqtt_consumer.tags]
    technology = "wifi_v2"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic       = "+/+/+/+/+/+"
    measurement = "_/_/_/_/measurement/_"
    tags        = "_/_/_/_/_/sensor_uuid"

#####################################
## Processors
#####################################
[[processors.converter]]
  tagpass = { technology = ["wifi_v2"] }
  [processors.converter.fields]
    integer = ["devices_detected"]

[[processors.execd]]
  tagpass = { technology = ["wifi_v2"] }
  command = ["/usr/local/bin/pg_router_execd.py"]
  environment = ["PG_DSN=${PG_DSN}"]

#####################################
## Output
#####################################
[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_DEFAULT_BUCKET}"
  bucket_tag   = "bucket"
  exclude_bucket_tag = true

[[outputs.file]]
  files       = ["stdout"]
  data_format = "influx"
